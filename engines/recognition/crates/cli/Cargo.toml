[package]
name = "mc-cli"
version = "0.1.0"
edition = "2021"
description = "Media Clean Rust CLI workbench"
license = "UNLICENSED"

[[bin]]
name = "mc"
path = "src/main.rs"

[lib]
name = "mc_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mc-recognition-core = { path = "../core" }
mime_guess = "2.0"
open = "5.3"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
